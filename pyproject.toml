[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nadi9"
version = "0.1.0"
description = "Evidence-grounded agentic Nadi-9 subtitle decision platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "langgraph>=0.2.28",
  "langchain-core>=0.3.0",
  "fastapi>=0.110",
  "streamlit>=1.38",
  "uvicorn>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
openai = ["langchain-openai>=0.2.0"]

[project.scripts]
nadi9 = "nadi9.main:cli_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
